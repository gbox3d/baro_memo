# baro_memo — nginx 조각. web_pub 의 server 블록 **안에** include 한다:
#
#   # /etc/nginx/sites-available/web_pub 의 server { ... } 안에 한 줄:
#   include /home/gblab-dgx-01/works/baro_memo/deploy/nginx-baro-memo.conf;
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# 결과:
#   http://192.168.0.220/memo/admin/   관리자 페이지 (정적, 무빌드)
#   http://192.168.0.220/memo/api/     백엔드 프록시
#   http://192.168.0.220/memo/api/help 에이전트용 사용법 (영문)
#
# ⚠ 아래 proxy_pass 의 포트는 .env 의 PORT 와 **같아야 한다**. 한쪽만 바꾸면 502 가 된다
#   (2026-08-12 에 실제로 그랬다). 바꾼 뒤: sudo nginx -t && sudo systemctl reload nginx

# 팀원 기기에 스킬을 까는 한 줄:  curl -fsSL http://<주소>/memo/install.sh | sh
#
# 서버가 자기 스킬을 서빙한다 — /api/help 를 서버가 서빙하는 것과 같은 이유다. 팀원이 확실히
# 가진 것은 보드 주소 하나뿐이고(깃 접근권은 사람마다 다르다), 돌고 있는 서버와 스킬 판이
# 어긋날 수 없다.
location = /memo/install.sh {
    alias /home/gblab-dgx-01/works/baro_memo/scripts/install-skill.sh;
    default_type text/x-shellscript;
}

location /memo/skill/ {
    alias /home/gblab-dgx-01/works/baro_memo/skills/baro-memo/;
    default_type text/markdown;
}

location = /memo/admin { return 301 /memo/admin/; }

location /memo/admin/ {
    alias /home/gblab-dgx-01/works/baro_memo/apps/admin/public/;
    index index.html;
}

# /memo/api/... → 127.0.0.1:<PORT>/api/...  (접두사 /memo 는 벗겨서 넘긴다)
# X-Forwarded-Prefix 로 벗긴 접두사를 알려 준다 — help 문서의 링크가 이 값으로 절대경로를 만든다.
location /memo/api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /memo;
}
