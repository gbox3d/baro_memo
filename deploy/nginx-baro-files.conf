# baro_files — nginx 조각. web_pub 의 server 블록 **안에** include 한다:
#
#   include /home/gblab-dgx-01/works/baro_memo/deploy/nginx-baro-files.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# 결과 (사내망 :80 · 밖 :22030 — 같은 server 블록이라 자동으로 둘 다):
#   /files/api/       백엔드 프록시 (세션·청크·finalize·목록)
#   /files/api/help   에이전트용 사용법 (영문)
#   /files/dl/<sha256>/<이름>   완성본 다운로드 — nginx 가 디스크에서 직접, Range 지원
#   /files/upload.sh  업로드 클라이언트 한 벌 (소비자가 확실히 가진 것은 주소뿐이다)
#
# ⚠ proxy_pass 포트는 .env 의 FILES_PORT 와 같아야 한다. 한쪽만 바꾸면 502 다.

# 정적 alias 가 아니라 **프록시**다. 서버가 요청의 Host 로 스크립트 안의 기본 주소를 채워
# 주기 때문이다 — 사내망으로 받으면 사내망, 터널로 받으면 터널. 파일을 그대로 내보내면
# 그 안의 주소가 한 벌로 박혀 밖에 선 사람에게만 틀리고, 그 사람은 원인을 못 본다.
location = /files/upload.sh {
    proxy_pass http://127.0.0.1:3002/api/upload.sh;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /files;
}

location /files/api/ {
    proxy_pass http://127.0.0.1:3002/api/;
    # $host 가 아니라 $http_host — $host 는 포트를 뗀다(baro_memo 조각의 그 교훈 그대로).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /files;

    # 청크 상한(100MiB) + 여유. **이 location 에만** 올린다 — /memo/api/ 는 1MB 그대로다.
    client_max_body_size 120m;
    # 청크를 디스크에 다 받아 두었다가 넘기지 않는다. 켜 두면 모든 청크가 루트 NVMe 의
    # proxy_temp 를 한 번 더 지나가고(쓰기 I/O 두 배), 끊긴 몸통도 뒤늦게 통째로 도착한다.
    proxy_request_buffering off;
    # 연구실 간 링크는 느리고 가끔 멎는다. 80MB 청크가 20Mbps 로 30초를 넘는 것이 정상이다.
    client_body_timeout 1h;
    proxy_read_timeout  1h;
    proxy_send_timeout  1h;
}

# 다운로드 인증 — auth_request 가 요청마다 백엔드의 /api/verify 를 부른다. 백엔드는 보드의
# whoami 답을 분 단위로 캐시하므로, 보드가 재시작 중이어도 다운로드는 이어진다.
location = /files/_verify {
    internal;
    proxy_pass http://127.0.0.1:3002/api/verify;
    # 서브요청은 원요청의 헤더(x-memo-token 포함)를 물려받는다. 몸통만 자른다 —
    # 2.8GB 다운로드 요청의 몸통은 없지만, 규약으로 못박아 둔다.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
}

# 완성본 서빙. 경로의 마지막 조각(<이름>)은 저장에 관여하지 않는다 — 브라우저·curl -O 가
# 쓸 파일 이름일 뿐이고, 실체는 해시가 가리키는 store/<sha256> 하나다.
#
# ⚠ 아래 alias 의 뿌리는 baro_files/.env 의 FILES_ROOT 와 **같아야 한다** (proxy_pass 포트와
#   같은 종류의 결합이다). www-data 가 읽을 수 있어야 한다 — 디렉터리 755 · 파일 644 는
#   백엔드(store.mjs)가 만들 때 챙긴다.
# 정규식은 인용부호가 필수다 — {64} 의 중괄호를 nginx 파서가 블록 여닫이로 읽는다.
location ~ "^/files/dl/(?<artifact_hash>[0-9a-f]{64})(/[^/]*)?$" {
    auth_request /files/_verify;
    # auth 서브요청이 401/403 밖의 것을 답하면 nginx 규칙상 클라이언트에는 맨 500 이 된다 —
    # 백엔드의 503 identity_unavailable(재시도하면 되는 일)이 500(원인 불명)으로 뭉개진다.
    # 이 location 의 500 원천은 auth 서브요청뿐이므로(정적 서빙은 404/416 계열) 되돌려 준다.
    error_page 500 = @baro_files_identity_down;
    alias /mnt/data/baro_memo_files/store/$artifact_hash;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
}

location @baro_files_identity_down {
    default_type application/json;
    add_header Retry-After 5 always;
    return 503 '{"error":"identity check did not answer - retry shortly","code":"identity_unavailable","retryable":true}';
}
